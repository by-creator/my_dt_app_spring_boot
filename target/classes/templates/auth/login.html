<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Connexion | Dakar Terminal Admin</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root { --primary: #4B49AC; --secondary: #7978E9; }
        body {
            font-family: 'Overpass', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-wrapper {
            width: 100%; max-width: 440px; padding: 16px;
        }
        .login-card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #4B49AC, #7978E9);
            padding: 36px 40px 28px;
            text-align: center; color: #fff;
        }
        .login-logo {
            width: 64px; height: 64px; border-radius: 16px;
            background: rgba(255,255,255,.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 28px; font-weight: 700; color: #fff;
        }
        .login-header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
        .login-header p  { font-size: 13px; opacity: .85; margin: 0; }
        .login-body { padding: 36px 40px 40px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: #aaa; font-size: 15px;
        }
        .input-icon .form-control { padding-left: 40px; }
        .form-control {
            border-radius: 8px; border: 1.5px solid #e0e0e0;
            font-size: 14px; padding: 12px 14px; transition: .2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75,73,172,.12);
        }
        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; color: #fff; width: 100%;
            padding: 13px; border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; transition: .2s;
        }
        .btn-login:hover { opacity: .9; transform: translateY(-1px); }
        .alert { border-radius: 8px; font-size: 13px; }
        .login-footer {
            text-align: center; color: #aaa; font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">DT</div>
            <h1>Dakar Terminal</h1>
            <p>Espace Administration</p>
        </div>
        <div class="login-body">
            <div th:if="${errorMsg}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${errorMsg}"></span>
            </div>
            <div th:if="${logoutMsg}" class="alert alert-info">
                <i class="fas fa-info-circle mr-2"></i>
                <span th:text="${logoutMsg}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="admin@dakarterminal.sn" required autofocus/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" required/>
                    </div>
                </div>

                <button type="submit" class="btn-login mt-2">
                    <i class="fas fa-sign-in-alt mr-2"></i> Se connecter
                </button>
            </form>
        </div>
    </div>
    <div class="login-footer">
        &copy; 2024 Dakar Terminal — Système de Gestion Portuaire
    </div>
</div>
</body>
</html>
