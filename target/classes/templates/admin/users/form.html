<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Formulaire Utilisateur</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>
            <i class="fas fa-user-cog mr-2" style="color:#4B49AC"></i>
            <span th:text="${isEdit} ? 'Modifier l\'Utilisateur' : 'Créer un Utilisateur'"></span>
        </h1>
        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Retour
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-edit mr-2"></i>
                    <span th:text="${isEdit} ? 'Mise à jour de l\'utilisateur' : 'Nouvel utilisateur'"></span>
                </div>
                <div class="card-body">
                    <form th:action="${isEdit} ? @{/admin/users/{id}/edit(id=${userId})} : @{/admin/users/create}"
                          th:object="${userForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="name">
                                        Nom complet <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="name" th:field="*{name}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="Prénom NOM"/>
                                    <div class="invalid-feedback" th:errors="*{name}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="email">
                                        Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" id="email" th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           placeholder="prenom.nom@dakarterminal.sn"
                                           th:readonly="${isEdit}"/>
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="password">
                                        Mot de passe
                                        <span th:if="${!isEdit}" class="text-danger">*</span>
                                        <small th:if="${isEdit}" class="text-muted">(laisser vide pour conserver)</small>
                                    </label>
                                    <input type="password" id="password" th:field="*{password}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           placeholder="Minimum 8 caractères"/>
                                    <div class="invalid-feedback" th:errors="*{password}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="roleId">Rôle</label>
                                    <select id="roleId" th:field="*{roleId}" class="form-control">
                                        <option value="">-- Sélectionner un rôle --</option>
                                        <option th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name + (role.description != null ? ' — ' + role.description : '')}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="twoFactorEnabled"
                                       th:field="*{twoFactorEnabled}"/>
                                <label class="custom-control-label" for="twoFactorEnabled">
                                    Activer l'authentification à deux facteurs (2FA)
                                </label>
                            </div>
                        </div>

                        <div class="d-flex mt-4">
                            <button type="submit" class="btn btn-primary mr-2">
                                <i class="fas fa-save mr-1"></i>
                                <span th:text="${isEdit} ? 'Enregistrer les modifications' : 'Créer l\'utilisateur'"></span>
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
