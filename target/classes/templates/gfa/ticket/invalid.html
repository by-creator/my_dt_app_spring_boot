<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Accès invalide — Dakar Terminal</title>
    <link rel="icon" type="image/png" href="/img/image.png"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #4B49AC;
            --secondary: #7978E9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Overpass', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f4f7ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            color: #1f2a44;
            text-align: center;
        }
        .page-logo img { height: 52px; width: auto; object-fit: contain; margin-bottom: 40px; }
        .error-icon {
            width: 88px; height: 88px;
            background: rgba(220, 53, 69, .12);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: #dc3545;
            margin: 0 auto 28px;
        }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
        p  { font-size: 15px; color: #5b657a; max-width: 340px; line-height: 1.6; }
        .hint {
            margin-top: 32px;
            background: #fff;
            border: 1px solid rgba(31,42,68,.12);
            border-radius: 16px;
            padding: 20px 28px;
            display: flex; align-items: center; gap: 14px;
            max-width: 380px;
        }
        .hint-icon {
            width: 48px; height: 48px; flex-shrink: 0;
            background: rgba(75,73,172,.12);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--primary);
        }
        .hint-text { text-align: left; font-size: 13px; color: #5b657a; line-height: 1.5; }
        .hint-text strong { color: #1f2a44; display: block; margin-bottom: 2px; font-size: 14px; }
    </style>
</head>
<body>

<div class="page-logo">
    <img src="/img/image.png" alt="Dakar Terminal"/>
</div>

<div class="error-icon">
    <i class="fas fa-ban"></i>
</div>

<h1>Accès non autorisé</h1>
<p>Ce lien n'est plus valide. Il a peut-être expiré ou a déjà été utilisé.</p>

<div class="hint">
    <div class="hint-icon"><i class="fas fa-qrcode"></i></div>
    <div class="hint-text">
        <strong>Que faire ?</strong>
        Scannez à nouveau le QR code affiché sur l'écran principal pour obtenir un nouveau lien d'accès.
    </div>
</div>

</body>
</html>
