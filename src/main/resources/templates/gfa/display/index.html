<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Écran d'affichage — Dakar Terminal</title>
    <link rel="icon" type="image/png" href="/img/image.png"/>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --primary: #4B49AC;
            --secondary: #7978E9;
            --info: #248AFD;
            --text-primary: #1f2a44;
            --text-secondary: #5b657a;
            --surface: #ffffff;
            --surface-alt: #f7f9ff;
            --border-soft: rgba(31, 42, 68, .12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Overpass', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f4f7ff 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .display-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255,255,255,.96);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: 0 4px 14px rgba(17, 34, 68, .06);
        }
        .display-topbar img {
            height: 40px;
            width: auto;
            object-fit: contain;
            filter: none;
        }
        .display-topbar .dt-clock {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }
        .display-topbar .dt-date {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 2px;
        }

        /* ── MAIN DISPLAY ── */
        .display-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 32px 16px;
        }

        .display-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            box-shadow: 0 16px 42px rgba(17, 34, 68, .08);
            border-radius: 24px;
            padding: 60px 48px;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        .display-now-serving {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .display-ticket-badge {
            background: linear-gradient(135deg, var(--secondary), var(--info));
            border-radius: 16px;
            padding: 6px 28px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            display: inline-block;
        }

        .display-ticket-number {
            font-size: 120px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -4px;
            line-height: 1;
            text-shadow: 0 4px 24px rgba(36,138,253,.18);
        }

        .display-divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--secondary), var(--info));
            border-radius: 2px;
        }

        .display-agent-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .display-guichet-badge {
            background: var(--surface-alt);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 10px 20px;
            text-align: center;
        }
        .display-guichet-badge .gb-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .display-guichet-badge .gb-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 2px;
        }
        .display-agent-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ── QR SECTION ── */
        .qr-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 0 32px 32px;
        }

        .qr-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .qr-card img {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 10px;
            background: #fff;
            padding: 4px;
        }
        .qr-card .qr-step {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .qr-card .qr-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .qr-card .qr-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .qr-icon-wifi  { background: rgba(36,138,253,.3); color: #248AFD; }
        .qr-icon-ticket { background: rgba(121,120,233,.3); color: #7978E9; }

        @media (max-width: 576px) {
            .display-ticket-number { font-size: 80px; }
            .display-card { padding: 40px 20px; }
            .qr-section { grid-template-columns: 1fr; }
            .display-topbar { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<!-- Topbar -->
<div class="display-topbar">
    <img src="/img/image.png" alt="Dakar Terminal"/>
    <div style="text-align:right">
        <div class="dt-clock" id="clock">00:00:00</div>
        <div class="dt-date" id="date-display"></div>
    </div>
</div>

<!-- Main display -->
<div class="display-area">
    <div class="display-card">
        <div class="display-now-serving">Appel en cours</div>
        <div class="display-ticket-badge" id="service-badge">— SERVICE —</div>
        <div class="display-ticket-number" id="ticket-number">—</div>
        <div class="display-divider"></div>
        <div class="display-agent-row">
            <div class="display-guichet-badge">
                <div class="gb-label">Guichet</div>
                <div class="gb-value" id="guichet-name">—</div>
            </div>
            <div class="display-agent-name" id="agent-name">En attente</div>
        </div>
    </div>
</div>

<!-- QR codes -->
<div class="qr-section">
    <div class="qr-card">
        <div class="qr-icon qr-icon-wifi"><i class="fas fa-wifi"></i></div>
        <img th:src="|https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${wifiQrData}|"alt="QR Code WiFi"/>
        <div>
            <div class="qr-step">Étape 1</div>
            <div class="qr-title">Connexion au réseau Wi-Fi</div>
            <div class="qr-subtitle" th:text="|SSID: ${wifiSsid}|">SSID: DakarTerminal_WiFi</div>
            <div class="qr-subtitle" th:text="|Mot de passe: ${wifiPassword}|">Mot de passe: </div>
        </div>
    </div>
    <div class="qr-card">
        <div class="qr-icon qr-icon-ticket"><i class="fas fa-ticket-alt"></i></div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://dakarterminal.sn/gfa/ticket"
             alt="QR Code Ticket"/>
        <div>
            <div class="qr-step">Étape 2</div>
            <div class="qr-title">Prendre un ticket</div>
        </div>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = hh + ':' + mm + ':' + ss;

    const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    document.getElementById('date-display').textContent =
        days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
