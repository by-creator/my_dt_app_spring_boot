<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Gestion des Rôles</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1><i class="fas fa-shield-alt mr-2" style="color:#4B49AC"></i>Gestion des Rôles</h1>
        <a th:href="@{/admin/roles/create}" class="btn btn-primary">
            <i class="fas fa-plus mr-1"></i> Nouveau rôle
        </a>
    </div>

    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap" style="gap:8px">
            <span><i class="fas fa-list mr-2"></i>Liste des rôles
                <span class="badge badge-secondary ml-2" th:text="${#lists.size(roles)}">0</span>
            </span>
            <div style="position:relative;min-width:240px">
                <i class="fas fa-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px"></i>
                <input type="text" id="roleSearch" placeholder="Rechercher..." autocomplete="off"
                       class="form-control form-control-sm" style="padding-left:30px"/>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nom du rôle</th>
                            <th>Description</th>
                            <th>Statut</th>
                            <th>Créé le</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role, stat : ${roles}" data-row="true">
                            <td th:text="${stat.index + 1}" class="text-muted"></td>
                            <td>
                                <span class="badge-role" th:text="${role.name}"></span>
                            </td>
                            <td th:text="${role.description != null ? role.description : '—'}"></td>
                            <td>
                                <span th:if="${role.actif}" class="badge badge-success">Actif</span>
                                <span th:unless="${role.actif}" class="badge badge-secondary">Inactif</span>
                            </td>
                            <td th:text="${role.createdAt != null ? #temporals.format(role.createdAt, 'dd/MM/yyyy') : '—'}"></td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/roles/{id}/edit(id=${role.id})}"
                                       class="btn btn-outline-primary" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/roles/{id}/toggle(id=${role.id})}" method="post" style="display:inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-outline-warning" title="Activer/Désactiver">
                                            <i class="fas fa-toggle-on"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/roles/{id}/delete(id=${role.id})}" method="post" style="display:inline"
                                          onsubmit="return confirm('Supprimer ce rôle ?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-outline-danger" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="fas fa-shield-alt fa-2x mb-2 d-block"></i>
                                Aucun rôle trouvé.
                                <a th:href="@{/admin/roles/create}">Créer le premier rôle</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
document.getElementById('roleSearch').addEventListener('input', function() {
    var q = this.value.toLowerCase();
    document.querySelectorAll('tbody tr[data-row]').forEach(function(row) {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});
</script>
</th:block>
</body>
</html>
