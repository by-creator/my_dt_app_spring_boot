<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Formulaire Rôle</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>
            <i class="fas fa-shield-alt mr-2" style="color:#4B49AC"></i>
            <span th:text="${isEdit} ? 'Modifier le Rôle' : 'Créer un Rôle'"></span>
        </h1>
        <a th:href="@{/admin/roles}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Retour
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-form mr-2"></i>
                    <span th:text="${isEdit} ? 'Mise à jour du rôle' : 'Nouveau rôle'"></span>
                </div>
                <div class="card-body">
                    <form th:action="${isEdit} ? @{/admin/roles/{id}/edit(id=${roleId})} : @{/admin/roles/create}"
                          th:object="${roleForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-group">
                            <label class="form-label" for="name">
                                Nom du rôle <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="name" th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="ex: RESPONSABLE_RH"
                                   style="text-transform:uppercase"
                                   oninput="this.value=this.value.toUpperCase()"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                            <small class="text-muted">En majuscules uniquement (lettres, chiffres, underscore)</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Description</label>
                            <textarea id="description" th:field="*{description}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      rows="3"
                                      placeholder="Description des droits et responsabilités de ce rôle..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="form-group">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="actif"
                                       th:field="*{actif}" th:checked="*{actif}"/>
                                <label class="custom-control-label" for="actif">Rôle actif</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary mr-2">
                                <i class="fas fa-save mr-1"></i>
                                <span th:text="${isEdit} ? 'Enregistrer les modifications' : 'Créer le rôle'"></span>
                            </button>
                            <a th:href="@{/admin/roles}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
